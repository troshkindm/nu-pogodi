    let state = seed;
    return () => {
      state = (state + 0x6d2b79f5) | 0;
      let t = Math.imul(state ^ (state >>> 15), 1 | state);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

      (x > 838 && y > 52 && y < 262) ||

      const y = 40 + rand() * 512;

      const length = 10 + rand() * 22;
      const angle = -0.35 + (rand() - 0.5) * 1.1;
      list.push({ x, y, x2: x + Math.cos(angle) * length, y2: y + Math.sin(angle) * length, bend: (rand() - 0.5) * 1.2, width: 0.8 + rand() * 0.35, alpha: 0.2 + rand() * 0.14 });

  function loadImage(markup) {

    gl.uniform1f(lit.uFade, fade);
    gl.uniform4fv(lit.uCaps, ROUND_KEYS.flatMap(([x, y], i) => [(x - VIEW.x) * PX, (y - VIEW.y) * PX, 23.5 * PX, pressed.round[i]]));
    gl.uniform4fv(lit.uPills, PILL_KEYS.flatMap(([x, y], i) => [(x - VIEW.x) * PX, (y - VIEW.y) * PX, 22.5 * PX, pressed.pill[i]]));
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(programs.post.program);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  if (MODE_3D) {
    import('./lookdev-3d.js').then((module) => module.start3d()).catch((error) => { document.body.dataset.error = String(error); console.error(error); });
  } else {
    setupRenderer().catch((error) => { document.body.dataset.error = String(error); console.error(error); });
  }

  if (params.has('live')) {
    window.addEventListener('pointermove', (event) => {
      const x = event.clientX / innerWidth - 0.5;
      const y = event.clientY / innerHeight - 0.5;
      light.key = [-0.48 - x * 0.5, -0.55 - y * 0.5, 0.68];
      requestAnimationFrame(draw);
    });
  }

  const hits = document.getElementById('hits');
  function make(tag, attrs, parent) {
    const node = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    parent.appendChild(node);
    return node;
  }
  function bindPress(node, list, index, onPress) {
    const set = (value) => { pressed[list][index] = value; requestAnimationFrame(draw); };
    node.addEventListener('pointerdown', (event) => { event.preventDefault(); set(1); onPress(); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((type) => node.addEventListener(type, () => set(0)));
    return set;
  }

  const segs = document.getElementById('segs');
  segs.setAttribute('transform', 'translate(273.4 151.95) scale(0.295)');
  const SEG = {};
  Object.entries(LCD_ART.paths).forEach(([id, d]) => {
    SEG[id] = make('g', { class: 'seg' }, segs);
    make('path', { d, stroke: 'none' }, SEG[id]);
  });
  Object.entries(LCD_ART.texts).forEach(([id, [x, y, size, text, length]]) => {
    SEG[id] = make('g', { class: 'seg' }, segs);
    make('text', { x, y, 'font-size': size, 'font-weight': 800, stroke: 'none', textLength: length, lengthAdjust: 'spacingAndGlyphs' }, SEG[id]).textContent = text;
  });
  const film = make('g', { transform: 'translate(273.4 151.95) scale(0.295)' }, document.getElementById('print'));
  [['green', '#456a22'], ['rail', '#a4532a'], ['red', '#9e2f26'], ['black', '#22231d']].forEach(([key, fill]) => make('path', { d: LCD_ART.film[key], fill }, film));
  const pick = (ids) => ids.map((id) => SEG[id]);
  const toggle = (nodes, on) => [].concat(nodes).forEach((g) => g.classList.toggle('on', on));

  const eggSegments = [
    ['3.0.1', '3.0.0', '3.1.0', '3.1.1', '3.2.1'],
    ['3.2.0', '3.3.0', '3.3.1', '2.0.1', '2.0.0'],
    ['7.0.1', '8.3.1', '8.3.0', '8.2.0', '8.2.1'],
    ['8.1.0', '8.1.1', '8.0.0', '8.0.1', '0.3.1'],
  ].map(pick);
  const wolves = [
    { body: SEG['1.1.0'], arms: pick(['1.1.1', '1.0.0']) },
    { body: SEG['1.2.1'], arms: pick(['1.3.1', '1.3.0']) },
  ];
  const hare = pick(['4.3.1', '4.3.0']);
  const fallen = [pick(['2.3.1', '2.3.0']), pick(['0.0.0', '0.0.1'])];
  const missMarks = pick(['4.0.1', '4.1.1', '6.0.1']);
  const labels = pick(['2.2.0', '0.1.1']);
  const meridiem = pick(['4.1.0', '1.2.0']);
  const SEVEN = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' };
  const digits = ['5', '6', '7'].map((n) => ({ a: SEG[`${n}.1.0`], b: SEG[`${n}.0.0`], c: SEG[`${n}.3.0`], d: SEG[`${n}.3.1`], e: SEG[`${n}.2.1`], f: SEG[`${n}.1.1`], g: SEG[`${n}.2.0`] }));
  const leadingOne = SEG['4.0.0'];
  const colon = SEG['5.0.1'];

  function showNumber(text) {
    const padded = text.padStart(4, ' ').slice(-4);
    leadingOne.classList.toggle('on', padded[0] === '1');
    digits.forEach((digit, i) => {
      const lit = SEVEN[padded[i + 1]] || '';
      Object.entries(digit).forEach(([name, g]) => g.classList.toggle('on', lit.includes(name)));
    });
  }

  let audio = null;
  function unlockAudio() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  }
  function beep(frequency, duration = 0.03, volume = 0.05) {
    if (!audio) return;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    const t = audio.currentTime + 0.005;
    osc.type = 'square';
    osc.frequency.setValueAtTime(frequency, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(volume, t + 0.002);
    gain.gain.setValueAtTime(volume, t + duration - 0.004);
    gain.gain.linearRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + duration + 0.01);
  }
  ['pointerup', 'keydown'].forEach((type) => window.addEventListener(type, unlockAudio));

  let state = { basket: 0, eggs: [], score: 0, misses: 0, running: false, tick: 0, mode: 0 };
  let loop = null;
  let clockTimer = null;

  function render() {
    const side = state.basket < 2 ? 0 : 1;
    wolves.forEach((wolf, i) => {
      wolf.body.classList.toggle('on', i === side);
      wolf.arms.forEach((arm, j) => arm.classList.toggle('on', i === side && j === state.basket % 2));
    });
    eggSegments.forEach((steps, chute) => steps.forEach((g, step) =>
      g.classList.toggle('on', state.eggs.some((egg) => egg.chute === chute && egg.step === step))));
    missMarks.forEach((g, i) => g.classList.toggle('on', i < state.misses));
    labels.forEach((g, i) => g.classList.toggle('on', state.running && i === state.mode));
    toggle(hare, state.running && Math.floor(state.tick / 12) % 3 === 1);
    meridiem.forEach((g, i) => g.classList.toggle('on', Boolean(clockTimer) && i === (state.pm ? 1 : 0)));
    if (!clockTimer) showNumber(String(state.score));
    colon.classList.toggle('on', Boolean(clockTimer));
    updateLcd();
  }
  function moveTo(position) { state.basket = position; render(); }
  function step() {
    state.tick += 1;
    state.eggs.filter((egg) => (state.tick + egg.chute) % 2 === 0).forEach((egg) => { egg.step += 1; beep(2048, 0.025); });
    state.eggs.filter((egg) => egg.step > 4).forEach((egg) => {
      if (egg.chute === state.basket) { state.score += 1; beep(4096, 0.05); return; }
      state.misses += 1;
      const side = egg.chute < 2 ? 0 : 1;
      toggle(fallen[side], true);
      setTimeout(() => toggle(fallen[side], false), 800);
      beep(1024, 0.3, 0.06);
    });
    state.eggs = state.eggs.filter((egg) => egg.step <= 4);
    const free = [0, 1, 2, 3].filter((chute) => !state.eggs.some((egg) => egg.chute === chute && egg.step < 2));
    if (state.eggs.length < 1 + Math.floor(state.score / 10) && free.length && Math.random() < 0.5) {
      state.eggs.push({ chute: free[Math.floor(Math.random() * free.length)], step: 0 });
    }
    if (state.misses >= 3) { clearInterval(loop); state.running = false; [4096, 3072, 2048, 1024].forEach((f, i) => setTimeout(() => beep(f, 0.09), i * 100)); }
    render();
  }
  function startGame(interval, mode) {
    clearInterval(loop);
    stopClock();
    state = { basket: 0, eggs: [], score: 0, misses: 0, running: true, tick: 0, mode };
    [0, 1, 2, 3].forEach((i) => setTimeout(() => beep(4096, 0.06), i * 125));
    loop = setInterval(step, interval);
    render();
  }
  function stopClock() { clearTimeout(clockTimer); clockTimer = null; }
  function showClock() {
    stopClock();
    const now = new Date();
    clockTimer = setTimeout(() => { stopClock(); render(); }, 2500);
    state.pm = now.getHours() >= 12;
    showNumber(`${now.getHours() % 12 || 12}${String(now.getMinutes()).padStart(2, '0')}`);
    render();
  }

  const roundSetters = ROUND_KEYS.map(([cx, cy], i) => bindPress(make('circle', { class: 'hit', cx, cy, r: 30 }, hits), 'round', i, () => moveTo(i)));
  const pillActions = [() => startGame(560, 0), () => startGame(380, 1), showClock];
  window.press3d = (list, i, down) => {
    pressed[list][i] = down ? 1 : 0;
    draw();
    if (down) (list === 'round' ? () => moveTo(i) : pillActions[i])();
  };
  PILL_KEYS.forEach(([cx, cy], i) => bindPress(make('rect', { class: 'hit', x: cx - 27, y: cy - 16, width: 54, height: 32, rx: 16 }, hits), 'pill', i, pillActions[i]));

  const KEYS = { q: 0, a: 1, p: 2, l: 3, й: 0, ф: 1, з: 2, д: 3, arrowleft: 0, arrowdown: 1, arrowup: 2, arrowright: 3 };
  window.addEventListener('keydown', (event) => {
    const position = KEYS[event.key.toLowerCase()];
    if (position === undefined) { if (event.key === 'Enter' || event.key === ' ') startGame(560, 0); return; }
    roundSetters[position](1);
    moveTo(position);
  });
  window.addEventListener('keyup', (event) => {
    const position = KEYS[event.key.toLowerCase()];
    if (position !== undefined) roundSetters[position](0);
  });

  if (REF) {
    document.querySelectorAll('.seg').forEach((g) => g.classList.add('on'));
  } else {
    render();
    showClock();
  }
</script>
</body>
</html>
